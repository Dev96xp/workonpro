<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#09090b">
    <title>Workon — Offline</title>
    <style>
        body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #09090b; color: #fafafa; font-family: system-ui, -apple-system, sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
        .logo { width: 72px; height: 72px; border-radius: 18px; background: #facc15; color: #09090b; font-weight: 900; font-size: 44px; display: flex; align-items: center; justify-content: center; margin: 0 auto 24px; }
        h1 { font-size: 22px; margin: 0 0 8px; }
        p { color: #a1a1aa; margin: 0 0 4px; }
        button { margin-top: 24px; background: #facc15; color: #09090b; border: 0; border-radius: 999px; padding: 12px 28px; font-weight: 800; font-size: 15px; cursor: pointer; }
    </style>
</head>
<body>
    <main>
        <div class="logo">W</div>
        <h1>You're offline</h1>
        <p>Check your internet connection and try again.</p>
        <p>Sin conexión a internet. Revisa tu conexión e inténtalo de nuevo.</p>
        <button onclick="location.reload()">Retry / Reintentar</button>
    </main>
</body>
</html>
